<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Personal AI v4</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>body{font-family:Segoe UI,Arial;background:#f5f7fb;color:#172033;margin:0}.w{max-width:1050px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:22px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:20px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#4f46e5;color:white}.ask{display:flex;gap:10px}input{flex:1;padding:13px;border:1px solid #ddd;border-radius:10px}#a{margin-top:16px;padding:15px;background:#f9fafb;border-radius:12px;white-space:pre-wrap;line-height:1.5}.chip{margin:10px 5px 0 0;padding:8px 12px;border:1px solid #ddd;border-radius:20px;background:white;cursor:pointer}.on{color:#067647;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="w"><div class="top"><div><h1>My Personal AI</h1><p>Gmail + Calendar in one assistant.</p></div><button id="c" class="btn">Connect Google</button></div>
<div class="grid"><main class="card"><h2>Ask your PA</h2><div class="ask"><input id="q" placeholder="e.g. Remind me on October 2 at 7 PM to pay school fees"><button id="go" class="btn">Ask</button></div>
<button class="chip" data-q="What important things do I need to take care of?">Important actions</button><button class="chip" data-q="Show my upcoming calendar events">Upcoming events</button>
<div id="a">Connect your demo Google account to begin.</div></main><aside class="card"><h2>Connections</h2><p>Gmail: <span id="gs">Not connected</span></p><p>Calendar: <span id="cs">Not connected</span></p><small>Gmail read-only + Calendar read/write.</small></aside></div></div>
<script>
const CID='638436880467-6fi7jr9t1jpee0iogj39tn47vcprhai3.apps.googleusercontent.com',SC='https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/calendar.events';let tok=null,tc=null,A=document.getElementById('a');
function init(){if(!window.google)return setTimeout(init,200);tc=google.accounts.oauth2.initTokenClient({client_id:CID,scope:SC,callback:r=>{if(r.error)return A.textContent='Auth error: '+r.error;tok=r.access_token;['gs','cs'].forEach(i=>{let e=document.getElementById(i);e.textContent='Connected';e.className='on'});A.textContent='✓ Google connected. Gmail + Calendar ready.'}})}init();document.getElementById('c').onclick=()=>tc.requestAccessToken({prompt:'consent'});
async function api(u,opt={}){if(!tok)throw Error('Connect Google first.');let r=await fetch(u,{...opt,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}}),d=await r.json();if(!r.ok)throw Error(d.error?.message||'Google API error');return d}
function dec(s){s=(s||'').replace(/-/g,'+').replace(/_/g,'/');try{return decodeURIComponent(escape(atob(s)))}catch{return atob(s)}}function body(p){if(p?.body?.data)return dec(p.body.data);for(let x of(p?.parts||[]))if(x.mimeType==='text/plain'&&x.body?.data)return dec(x.body.data);return''}
async function mail(){let l=await api('https://gmail.googleapis.com/gmail/v1/users/me/messages?q='+encodeURIComponent('subject:"School Registration"')+'&maxResults=5');if(!l.messages?.length)return null;let m=await api('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+l.messages[0].id+'?format=full');let h=Object.fromEntries((m.payload.headers||[]).map(x=>[x.name.toLowerCase(),x.value]));return{subject:h.subject||'',text:(body(m.payload)||m.snippet||'').replace(/\*/g,'')}}
async function events(){let u='https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=8&timeMin='+encodeURIComponent(new Date().toISOString());return(await api(u)).items||[]}
function parseReminder(s){let m=s.match(/(?:remind me|create (?:an )?event)(?: on)?\s+(September|October|November|December)\s+(\d{1,2})(?:,?\s*2026)?\s+(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(AM|PM)\s+(?:to\s+)?(.+)/i);if(!m)return null;let months={september:8,october:9,november:10,december:11},h=+m[3],min=+(m[4]||0);if(m[5].toUpperCase()==='PM'&&h<12)h+=12;if(m[5].toUpperCase()==='AM'&&h===12)h=0;let d=new Date(2026,months[m[1].toLowerCase()],+m[2],h,min);return{title:m[6].replace(/[.]+$/,''),start:d,end:new Date(d.getTime()+15*60000)}}
function isoLocal(d){let z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())+':00+05:30'}
async function createEvent(x){let payload={summary:x.title,start:{dateTime:isoLocal(x.start),timeZone:'Asia/Kolkata'},end:{dateTime:isoLocal(x.end),timeZone:'Asia/Kolkata'},reminders:{useDefault:true}};return api('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',body:JSON.stringify(payload)})}
async function run(s){A.textContent='Working…';try{let r=parseReminder(s);if(r){let e=await createEvent(r);A.textContent='✓ Calendar event created\n\n'+e.summary+'\n'+new Date(e.start.dateTime).toLocaleString()+'\n\nOpen Google Calendar to verify it.';return}let q=s.toLowerCase();if(q.includes('important')||q.includes('school')){let m=await mail();A.textContent=m?'📧 Important email found\n\n'+m.subject+'\n\n'+m.text+'\n\nSuggested action: Complete the school registration before the deadline.':'No School Registration email found.'}else if(q.includes('calendar')||q.includes('event')||q.includes('upcoming')){let x=await events();A.textContent='📅 Upcoming events\n\n'+(x.map(e=>'• '+(e.summary||'Untitled')+' — '+new Date(e.start.dateTime||e.start.date).toLocaleString()).join('\n')||'None found.')}else A.textContent='Try: Remind me on October 2 at 7 PM to pay school fees';}catch(e){A.textContent='Error: '+e.message}}
document.getElementById('go').onclick=()=>run(document.getElementById('q').value);document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')run(e.target.value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{document.getElementById('q').value=b.dataset.q;run(b.dataset.q)})
</script></body></html>
