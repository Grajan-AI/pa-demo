<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Personal AI</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>body{font-family:Segoe UI,Arial;background:#f5f7fb;color:#172033;margin:0}.w{max-width:1050px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:22px}.card{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:20px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#4f46e5;color:white}.ask{display:flex;gap:10px}.ask input{flex:1;padding:13px;border:1px solid #ddd;border-radius:10px}.status{color:#667085}.on{color:#067647;font-weight:700}#answer{margin-top:16px;padding:15px;background:#f9fafb;border-radius:12px;white-space:pre-wrap;line-height:1.5}.chip{margin:10px 5px 0 0;padding:8px 12px;border:1px solid #ddd;border-radius:20px;background:white}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="w"><div class="top"><div><h1>My Personal AI</h1><p>Gmail + Calendar in one assistant.</p></div><button id="connect" class="btn">Connect Google</button></div>
<div class="grid"><main class="card"><h2>Ask your PA</h2><div class="ask"><input id="q" placeholder="Ask your PA…"><button id="go" class="btn">Ask</button></div>
<button class="chip" data-q="What important things do I need to take care of?">Important actions</button><button class="chip" data-q="Show my upcoming calendar events">Upcoming events</button>
<div id="answer">Connect your demo Google account to begin.</div></main>
<aside class="card"><h2>Connections</h2><p>Gmail: <span id="gs" class="status">Not connected</span></p><p>Calendar: <span id="cs" class="status">Not connected</span></p><small>Permissions: Gmail read-only + Calendar events.</small></aside></div></div>
<script>
const CLIENT_ID='638436880467-6fi7jr9t1jpee0iogj39tn47vcprhai3.apps.googleusercontent.com',SCOPES='https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/calendar.events';let token=null,tc=null;
const ans=document.getElementById('answer');
function init(){if(!window.google){setTimeout(init,250);return}tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:r=>{if(r.error){ans.textContent='Authorization failed: '+r.error;return}token=r.access_token;['gs','cs'].forEach(x=>{let e=document.getElementById(x);e.textContent='Connected';e.classList.add('on')});ans.textContent='✓ Google connected. Gmail and Calendar are ready.'}})}init();
document.getElementById('connect').onclick=()=>tc.requestAccessToken({prompt:'consent'});
async function api(url){if(!token)throw Error('Connect Google first.');let r=await fetch(url,{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error?.message||'Google API error');return d}
function dec(s){s=(s||'').replace(/-/g,'+').replace(/_/g,'/');try{return decodeURIComponent(escape(atob(s)))}catch{return atob(s)}}
function body(p){if(p?.body?.data)return dec(p.body.data);for(let x of(p?.parts||[]))if(x.mimeType==='text/plain'&&x.body?.data)return dec(x.body.data);return''}
async function mail(){let l=await api('https://gmail.googleapis.com/gmail/v1/users/me/messages?q='+encodeURIComponent('subject:"School Registration"')+'&maxResults=5');if(!l.messages?.length)return null;let m=await api('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+l.messages[0].id+'?format=full');let h=Object.fromEntries((m.payload.headers||[]).map(x=>[x.name.toLowerCase(),x.value]));return{subject:h.subject||'',text:body(m.payload)||m.snippet||''}}
async function events(){let u='https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=8&timeMin='+encodeURIComponent(new Date().toISOString());return(await api(u)).items||[]}
async function run(q){ans.textContent='Working…';try{q=q.toLowerCase();if(q.includes('important')||q.includes('school')){let m=await mail();ans.textContent=m?'📧 Important email found\n\n'+m.subject+'\n\n'+m.text+'\n\nSuggested action: Complete the school registration before the deadline.':'No School Registration email found.'}else if(q.includes('calendar')||q.includes('event')||q.includes('upcoming')){let a=await events();ans.textContent='📅 Upcoming events\n\n'+(a.map(e=>'• '+(e.summary||'Untitled')+' — '+new Date(e.start.dateTime||e.start.date).toLocaleString()).join('\n')||'None found.')}else ans.textContent='PA v3 demo supports Gmail action discovery and upcoming Calendar events. AI reasoning comes next.'}catch(e){ans.textContent='Error: '+e.message+'\n\nIf this is an origin error, add this site HTTPS origin to your OAuth client.'}}
document.getElementById('go').onclick=()=>run(document.getElementById('q').value);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{document.getElementById('q').value=b.dataset.q;run(b.dataset.q)});
</script></body></html>
